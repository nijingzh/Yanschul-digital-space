# 同域反代（§12A.2）：/player → Folia（同域同源优先）。
# 若 Folia 不支持子路径部署，退子域名 player.<主域>（记疑问挂起）。
# UI 压制（浅色、无边框、无圆角卡片）与主题白名单在 Folia 侧配置（§12.3 / §12B.3）。
# M4 = 生产 /player 可访问且 UI 被 token 压制；等 VPS 部署后验收。

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # 日志（宿主机 ../logs，logrotate 轮转见 logrotate.d/folia-site）
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # 访客点赞计数（v36）：反代到 like-server（deploy/like-server，node server.cjs）
  # X-Real-IP 用于 like-server 的按 IP 冷却，不传的话所有访客共用一个 127.0.0.1。
  location /api/like {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 真正的 404（不能 try_files 兜底到 /404.html，否则未知 URL 会以 200 被收录）
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
    # 静态缓存（构建产物带内容 hash 的资源可长缓存；HTML 不缓存）
    # 注意：location 里一旦出现 add_header，server 级的安全头不会自动继承，这里要重复一遍
    location ~* \.(css|js|svg|webp|png|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
    add_header Cache-Control "no-cache";
  }

  # Folia 主界面/播放器（同域子路径）
  location /player/ {
    proxy_pass http://folia:8080/;       # TODO: 端口按 Folia 文档/部署形态校准
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Folia 歌词演出（Stage；主题白名单与 UI 压制在 Folia 侧配置）
  location /player/stage {
    proxy_pass http://folia:8080/stage;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 管理端：不对公网裸露（二选一，部署时按需放开注释）
  location /player/admin {
    # allow <江衍常用出口 IP>; deny all;          # 方式一：限制来源 IP
    # auth_basic "admin"; auth_basic_user_file /etc/nginx/.htpasswd;  # 方式二：basic auth
    proxy_pass http://folia:8080/admin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # HTTPS：certbot 签发后启用（证书放 deploy/ssl/，443 server 块由 certbot 生成或按模板）
  # server { listen 443 ssl; ssl_certificate /etc/nginx/ssl/fullchain.pem; ssl_certificate_key /etc/nginx/ssl/privkey.pem; ... }
}
