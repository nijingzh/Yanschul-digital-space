# 主站 443（裸机部署：/var/www/Yanschul-digital-space）
# 适用：站点静态产物 + /api/like 计数服务，证书由 certbot 管理。
# 部署：复制到 /etc/nginx/sites-available/，软链到 sites-enabled，nginx -t && nginx -s reload。

server {
    listen 443 ssl;
    http2 on;  # nginx < 1.25 请改成 listen 443 ssl http2;
    server_name nijingzh.top www.nijingzh.top;

    root /var/www/Yanschul-digital-space/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/nijingzh.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nijingzh.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/nijingzh.access.log;
    error_log  /var/log/nginx/nijingzh.error.log warn;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    # 真 404：不能 try_files 兜底到 /404.html，否则未知 URL 会以 200 被收录
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 点赞计数（deploy/like-server，systemd 常驻）
    location /api/like {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 带 hash 的构建资源长缓存；安全头要在本 location 重复（add_header 不继承）
    location ~* \.(css|js|svg|webp|png|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /rss.xml {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    server_name nijingzh.top www.nijingzh.top;
    return 301 https://$host$request_uri;
}
