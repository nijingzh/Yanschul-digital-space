# Folia 81 端口（音乐播放器 + 网易云 API 反代）
# 关键：/api 前缀必须剥掉，网易 API 的路由是 /song/url，不是 /api/song/url。
# 端口按你服务器实际进程校准：下面 3000 是网易 API，8080 是 Folia 页面。

server {
    listen 81 ssl;
    http2 on;
    server_name nijingzh.top;

    ssl_certificate     /etc/letsencrypt/live/nijingzh.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nijingzh.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 只给听歌需要的只读接口注入登录 Cookie；其余 /api/ 匿名转发，
    # 这样别人借不到你的登录态去调写接口（改歌单/改资料）。
    # Cookie 等同账号密码：只放服务器配置里，不进 git、不进前端。
    location ~ ^/api/(song/url|song/detail|song/download|lyric|playlist/track/all|album) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # proxy_set_header Cookie "MUSIC_U=你的; __csrf=你的";
    }

    # 其余接口：照常剥前缀转发，但不带你的 Cookie
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Folia 页面
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
